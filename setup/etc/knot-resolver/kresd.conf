-- Knot DNS Resolver configuration in -*- lua -*-
-- Refer to manual: https://www.knot-resolver.cz/documentation/latest5

local local_ttl = 300		-- TTL for local synthetic records
local max_ttl = 86400		-- Maximum cache TTL in seconds
local systemd_instance = os.getenv('SYSTEMD_INSTANCE')
local generated_config_path = '/etc/knot-resolver/antizapret-generated.conf'
local mode_names = {'udp', 'tcp', 'wireguard'}
local ipv4_modes = {
	antizapret = {
		udp = {network = '10.29.0.0/22', gateway = '10.29.0.1'},
		tcp = {network = '10.29.4.0/22', gateway = '10.29.4.1'},
		wireguard = {network = '10.29.8.0/24', gateway = '10.29.8.1'}
	},
	vpn = {
		udp = {network = '10.28.0.0/22', gateway = '10.28.0.1'},
		tcp = {network = '10.28.4.0/22', gateway = '10.28.4.1'},
		wireguard = {network = '10.28.8.0/24', gateway = '10.28.8.1'}
	}
}
local default_config = {
	ipv6_enabled = false,
	vpn_dns_self_hosted = false,
	anti_upstreams = {'62.76.76.62', '62.76.62.76', '195.208.4.1', '195.208.5.1'},
	proxy_upstreams = {'1.1.1.1', '1.0.0.1', '9.9.9.10', '149.112.112.10'},
	anti_ipv6 = {},
	vpn_ipv6 = {}
}

local function require_upstreams(config, key)
	local upstreams = config[key]
	if type(upstreams) ~= 'table' or #upstreams < 1 or #upstreams > 4 then
		error(key .. ' must contain between one and four DNS server addresses')
	end
	for _, address in ipairs(upstreams) do
		if type(address) ~= 'string' or address == '' then
			error(key .. ' contains an invalid DNS server address')
		end
	end
end

local function require_ipv6_modes(config, key)
	local modes = config[key]
	if type(modes) ~= 'table' then
		error(key .. ' must be a table')
	end
	for _, mode_name in ipairs(mode_names) do
		local mode = modes[mode_name]
		if type(mode) ~= 'table' or type(mode.network) ~= 'string' or type(mode.gateway) ~= 'string' then
			error(key .. '.' .. mode_name .. ' must define network and gateway')
		end
	end
end

local function load_generated_config(path)
	local handle = io.open(path, 'r')
	if not handle then
		return default_config
	end
	handle:close()

	local loaded, config = pcall(dofile, path)
	if not loaded then
		error('cannot load ' .. path .. ': ' .. tostring(config))
	end
	if type(config) ~= 'table' then
		error(path .. ' must return a table')
	end
	if type(config.ipv6_enabled) ~= 'boolean' or type(config.vpn_dns_self_hosted) ~= 'boolean' then
		error(path .. ' must define ipv6_enabled and vpn_dns_self_hosted booleans')
	end
	require_upstreams(config, 'anti_upstreams')
	require_upstreams(config, 'proxy_upstreams')
	if config.ipv6_enabled then
		require_ipv6_modes(config, 'anti_ipv6')
		if config.vpn_dns_self_hosted then
			require_ipv6_modes(config, 'vpn_ipv6')
		end
	end
	return config
end

local generated_config = load_generated_config(generated_config_path)
local nodata_answer = policy.ANSWER({
	[kres.type.SOA] = {
		rdata = kres.parse_rdata({'SOA . . 1 1 1 1 ' .. local_ttl}),
		ttl = local_ttl
	}
}, true)
local blocked_answer
if kres.extended_error and kres.extended_error.BLOCKED then
	blocked_answer = policy.DENY_MSG('blocked by AntiZapret policy', kres.extended_error.BLOCKED)
else
	blocked_answer = policy.DENY_MSG('blocked by AntiZapret policy')
end
local alternative_zones = policy.todnames({
	-- https://wiki.opennic.org/opennic/dot
	-- OpenNIC
	'bbs', 'chan', 'cyb', 'dyn', 'epic', 'geek', 'gopher', 'indy', 'libre', 'neo', 'null', 'o', 'oss', 'oz', 'parody', 'pirate', 'opennic.glue',
	-- Emercoin
	'bazar', 'coin', 'emc', 'lib',
	-- FurNIC
	'fur',
	-- New Nations
	'ku', 'te', 'ti', 'uu', 'ko', 'rm'
})

local function match_query_type(action, target_qtype)
	return function (state, query)
		if query.stype == target_qtype then
			-- filter matched the query, return action function
			return action
		else
			-- filter did not match, continue with next filter
			return nil
		end
	end
end

local function listen_on_ipv6_gateways(modes)
	for _, mode_name in ipairs(mode_names) do
		net.listen(modes[mode_name].gateway, 53, {kind = 'dns', freebind = true})
	end
end

local function hostname_answer(ipv4_gateway, ipv6_gateway)
	local records = {
		[kres.type.A] = {rdata = kres.str2ip(ipv4_gateway), ttl = local_ttl}
	}
	if ipv6_gateway then
		records[kres.type.AAAA] = {rdata = kres.str2ip(ipv6_gateway), ttl = local_ttl}
	end
	return policy.domains(policy.ANSWER(records, true), {todname(hostname())})
end

local function add_hostname_views(ipv4, ipv6)
	for _, mode_name in ipairs(mode_names) do
		local ipv4_mode = ipv4[mode_name]
		local ipv6_mode = ipv6 and ipv6[mode_name] or nil
		local ipv6_gateway = ipv6_mode and ipv6_mode.gateway or nil
		view:addr(ipv4_mode.network, hostname_answer(ipv4_mode.gateway, ipv6_gateway))
		if ipv6_mode then
			view:addr(ipv6_mode.network, hostname_answer(ipv4_mode.gateway, ipv6_gateway))
		end
	end
end

if string.match(systemd_instance, '^1') then

	-- Network interface configuration
	net.listen('127.1.1.1', 53, {kind = 'dns', freebind = true})
	if generated_config.ipv6_enabled then
		listen_on_ipv6_gateways(generated_config.anti_ipv6)
	end

	-- Switch to unprivileged user
	user('knot-resolver', 'knot-resolver')

	-- Clear cache upon restart
	os.execute('rm -rf /var/cache/knot-resolver/*')

	-- Open cache and set size
	cache.open(100 * MB, 'lmdb:///var/cache/knot-resolver')

	-- Load useful modules
	modules = {
		'view'											-- Views for certain clients
		,renumber = dofile('/etc/knot-resolver/renumber.lua')	-- IP address renumbering
		,'fallback'										-- Fallback on bad answer
	}

	-- Bind hostname to the matching IPv4 and IPv6 tunnel gateways
	add_hostname_views(
		ipv4_modes.antizapret,
		generated_config.ipv6_enabled and generated_config.anti_ipv6 or nil
	)

	-- Private, local, broadcast, test and special zones policy
	for _, item in ipairs(policy.special_names) do
		policy.add(item.cb)
	end

	-- Response policy zones and optional blocking ads, trackers, malware and phishing websites
	policy.add(policy.rpz(blocked_answer, '/etc/knot-resolver/deny.rpz', true))

	if not generated_config.ipv6_enabled then
		policy.add(match_query_type(nodata_answer, kres.type.AAAA))
	end

	-- Return an empty response for HTTPS queries
	policy.add(match_query_type(nodata_answer, kres.type.HTTPS))

	-- Return an empty response for SVCB queries
	policy.add(match_query_type(nodata_answer, kres.type.SVCB))

	-- Return an empty response for '*_*.arpa' queries
	policy.add(policy.pattern(nodata_answer, '.*_.*\4arpa\0'))

	-- Disable EDNS and query case randomization in upstream DNS queries
	policy.add(policy.all(policy.FLAGS({'NO_EDNS', 'NO_0X20'})))

	-- Resolve blocked domains using Proxy Resolver
	policy.add(policy.rpz(policy.STUB('127.3.3.3'), '/etc/knot-resolver/proxy.rpz', true))

	-- Resolve alternative domains: OpenNIC, Emercoin, FurNIC and New Nations
	policy.add(
		policy.suffix(
			policy.FORWARD({'94.247.43.254', '95.216.99.249', '152.53.15.127', '185.226.181.19'}),
			alternative_zones
		)
	)

	-- Resolve non-blocked domains
	policy.add(policy.all(policy.FORWARD(generated_config.anti_upstreams)))

elseif string.match(systemd_instance, '^2') then

	-- Network interface configuration
	net.listen('127.2.2.2', 53, {kind = 'dns', freebind = true})
	if generated_config.ipv6_enabled and generated_config.vpn_dns_self_hosted then
		listen_on_ipv6_gateways(generated_config.vpn_ipv6)
	end

	-- Switch to unprivileged user
	user('knot-resolver', 'knot-resolver')

	-- Clear cache upon restart
	os.execute('rm -rf /var/cache/knot-resolver2/*')

	-- Open cache and set size
	cache.open(100 * MB, 'lmdb:///var/cache/knot-resolver2')

	-- Load useful modules
	modules = {
		'view'											-- Views for certain clients
		,renumber = dofile('/etc/knot-resolver/renumber2.lua')	-- IP address renumbering
		,'fallback'										-- Fallback on bad answer
	}

	-- Bind hostname to the matching IPv4 and IPv6 tunnel gateways
	add_hostname_views(
		ipv4_modes.vpn,
		generated_config.ipv6_enabled and generated_config.vpn_dns_self_hosted and generated_config.vpn_ipv6 or nil
	)

	-- Private, local, broadcast, test and special zones policy
	for _, item in ipairs(policy.special_names) do
		policy.add(item.cb)
	end

	-- Response policy zones
	policy.add(policy.rpz(blocked_answer, '/etc/knot-resolver/deny2.rpz', true))

	if not generated_config.ipv6_enabled then
		policy.add(match_query_type(nodata_answer, kres.type.AAAA))
	end

	-- Return an empty response for HTTPS queries
	policy.add(match_query_type(nodata_answer, kres.type.HTTPS))

	-- Return an empty response for SVCB queries
	policy.add(match_query_type(nodata_answer, kres.type.SVCB))

	-- Return an empty response for '*_*.arpa' queries
	policy.add(policy.pattern(nodata_answer, '.*_.*\4arpa\0'))

	-- Disable EDNS and query case randomization in upstream DNS queries
	policy.add(policy.all(policy.FLAGS({'NO_EDNS', 'NO_0X20'})))

	-- Resolve alternative domains: OpenNIC, Emercoin, FurNIC and New Nations
	policy.add(
		policy.suffix(
			policy.FORWARD({'94.247.43.254', '95.216.99.249', '152.53.15.127', '185.226.181.19'}),
			alternative_zones
		)
	)

	-- Resolve blocked domains
	policy.add(policy.all(policy.FORWARD(generated_config.proxy_upstreams)))

else panic('Use kresd@1 or kresd@2 instance names')

end

-- Disable DNSSEC validation
trust_anchors.remove('.')

-- Do not extend upstream TTL values.
cache.min_ttl(0)
cache.max_ttl(max_ttl)

-- Ignore failed upstream only 1 ms
cache.ns_tout(1)

-- Disable unused modules
modules.unload('refuse_nord')
modules.unload('validate')
modules.unload('ta_update')
modules.unload('ta_signal_query')
modules.unload('ta_sentinel')
modules.unload('detect_time_skew')
modules.unload('priming')
modules.unload('edns_keepalive')
modules.unload('detect_time_jump')

-- Uncomment only for debugging or logging DNS requests
--log_level('debug')
