name: Apply IPv6 installer migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ipv6-installer.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update installer IPv6 handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          setup_path = Path("setup.sh")
          setup = setup_path.read_text(encoding="utf-8")

          prompt_anchor = """until [[ \"$WIREGUARD_ENABLE\" =~ (y|n) ]]; do
          \tread -rp 'Enable WireGuard/AmneziaWG? [y/n]: ' -e -i y WIREGUARD_ENABLE
          done
          echo
          """
          prompt = """until [[ \"$DISABLE_IPV6\" =~ (y|n) ]]; do
          \tread -rp 'Disable IPv6 on this server? [y/n]: ' -e -i n DISABLE_IPV6
          done
          echo
          """
          if prompt not in setup:
              if prompt_anchor not in setup:
                  raise SystemExit("WireGuard prompt anchor not found")
              setup = setup.replace(prompt_anchor, prompt_anchor + prompt, 1)

          old_ipv6 = """# Включим IPv6
          rm -f /etc/sysctl.d/99-disable-ipv6.conf
          sysctl -w net.ipv6.conf.all.disable_ipv6=0
          sysctl -w net.ipv6.conf.default.disable_ipv6=0
          sysctl -w net.ipv6.conf.lo.disable_ipv6=0
          """
          new_ipv6 = """# Настраиваем IPv6
          IPV6_SYSCTL=/etc/sysctl.d/99-antizapret-ipv6.conf
          rm -f /etc/sysctl.d/99-disable-ipv6.conf /etc/sysctl.d/99-proxy-ipv6.conf \"$IPV6_SYSCTL\"
          if [[ \"$DISABLE_IPV6\" == 'y' ]]; then
          \tcat > \"$IPV6_SYSCTL\" <<'EOF'
          # IPv6 disabled by AntiZapret installer
          net.ipv6.conf.all.forwarding=0
          net.ipv6.conf.default.forwarding=0
          net.ipv6.conf.all.disable_ipv6=1
          net.ipv6.conf.default.disable_ipv6=1
          net.ipv6.conf.lo.disable_ipv6=1
          EOF
          else
          \tcat > \"$IPV6_SYSCTL\" <<EOF
          # IPv6 enabled by AntiZapret installer
          net.ipv6.conf.all.disable_ipv6=0
          net.ipv6.conf.default.disable_ipv6=0
          net.ipv6.conf.lo.disable_ipv6=0
          net/ipv6/conf/${DEFAULT_INTERFACE}/accept_ra=2
          net.ipv6.conf.all.forwarding=1
          net.ipv6.conf.default.forwarding=1
          EOF
          fi
          sysctl -p \"$IPV6_SYSCTL\" || true
          """
          if new_ipv6 not in setup:
              if old_ipv6 not in setup:
                  raise SystemExit("Original IPv6 block not found")
              setup = setup.replace(old_ipv6, new_ipv6, 1)

          config_anchor = "WIREGUARD_ENABLE=$WIREGUARD_ENABLE\n"
          config_line = "DISABLE_IPV6=$DISABLE_IPV6\n"
          if config_line not in setup:
              if setup.count(config_anchor) != 1:
                  raise SystemExit("WIREGUARD_ENABLE config anchor is not unique")
              setup = setup.replace(config_anchor, config_anchor + config_line, 1)

          setup_path.write_text(setup, encoding="utf-8")

          proxy_path = Path("proxy.sh")
          proxy = proxy_path.read_text(encoding="utf-8")
          proxy = proxy.replace(
              'rm -f /etc/sysctl.d/99-disable-ipv6.conf "$IPV6_SYSCTL"',
              'rm -f /etc/sysctl.d/99-disable-ipv6.conf /etc/sysctl.d/99-antizapret-ipv6.conf "$IPV6_SYSCTL"',
              1,
          )
          proxy = proxy.replace(
              'net.ipv6.conf.${DEFAULT_INTERFACE}.accept_ra=2\nnet.ipv6.conf.all.forwarding=1',
              'net/ipv6/conf/${DEFAULT_INTERFACE}/accept_ra=2\nnet.ipv6.conf.all.forwarding=1',
              1,
          )
          proxy_path.write_text(proxy, encoding="utf-8")
          PY

      - name: Validate shell syntax and IPv6 defaults
        shell: bash
        run: |
          bash -n setup.sh
          bash -n proxy.sh
          grep -Fq "read -rp 'Disable IPv6 on this server? [y/n]:'" setup.sh
          grep -Fq 'DISABLE_IPV6=$DISABLE_IPV6' setup.sh
          grep -Fq 'net.ipv6.conf.all.forwarding=1' setup.sh
          grep -Fq 'net.ipv6.conf.all.forwarding=1' proxy.sh
          test ! -e setup/etc/sysctl.d/99-disable-ipv6.conf
          ! grep -R -n -F 'block-ipv6' setup/etc/openvpn

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- setup.sh proxy.sh; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add setup.sh proxy.sh
          git commit -m "Prepare installers for configurable IPv6"
          git push origin HEAD:main
